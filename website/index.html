<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080810" />
  <meta name="description" content="Family friendly movies" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Ohana TV" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>Ohana TV — Family friendly movies</title>
  <style>
    /* Critical mobile shell styles: keep the first paint mobile-shaped before Vue SFC CSS arrives on slow connections. */
    @media (max-width: 640px) {
      .app-header { min-height: 50px; padding: 8px 14px; }
      .hero { min-height: 0; padding: 14px 16px 8px; margin-bottom: 4px; border-bottom: 0; }
      .hero-poster-bg { opacity: 0.22; height: 132px; }
      .hero-bg-overlay { background: linear-gradient(to bottom, rgba(8,8,16,0.94), #080810); }
      .hero-brand { gap: 8px; margin-bottom: 9px; }
      .hero-kicker { display: none; }
      .hero-title { max-width: 320px; font-size: clamp(24px, 8vw, 34px); line-height: 1.02; letter-spacing: 0.035em; }
      .search-panel { margin: 0 -8px; padding: 0; border: 0; border-radius: 0; background: transparent; box-shadow: none; backdrop-filter: none; }
      .chip-row { flex-wrap: nowrap; gap: 8px; margin-top: 0; overflow-x: auto; padding: 2px 8px 6px; scrollbar-width: none; }
      .chip-row::-webkit-scrollbar { display: none; }
      .control-chip, .clear-btn { flex: 0 0 auto; min-height: 36px; white-space: nowrap; }
      .clear-btn { margin-left: 0; }
      .filter-summary { display: none; }
      .poster-col:nth-child(n+4) { display: none; }
      .skeleton-row, .row-header { padding-left: 16px; padding-right: 16px; }
      .row-track { padding: 8px 16px 16px; }
      .row-arrow { display: none; }
      .search-view { padding: 10px 14px 48px; }
      .settings-view { padding: 20px 14px 48px; }
      .list-view { padding: 18px 14px 48px; }
      .footer { padding: 24px 16px; }
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
